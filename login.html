<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - Generator Sertifikat Satker BPJS Kesehatan</title>
<link rel="icon" type="image/jpg" href="https://www.nesiatimes.com/wp-content/uploads/2023/10/Logo-BPJS-Kesehatan-RI-1200x971.jpg">
<style>
:root{--bpjs-blue:#0756a4;--bpjs-blue2:#0b75bd;--bpjs-green:#00a86b;--ink:#173b61;--muted:#667d95;--line:#dce8f3;--bg:#f2f7fc}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#f5f9ff,#edf8f4);font-family:Inter,Arial,sans-serif;color:var(--ink)}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px}
.login-card{width:min(100%,440px);background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 18px 50px #124a7618}
.login-mark{font-size:12px;font-weight:800;letter-spacing:1.8px;color:var(--bpjs-green);margin-bottom:12px}
.login-card h2{margin:0 0 8px;font-size:22px;color:var(--bpjs-blue)}
.login-subtitle{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.6}

label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px;color:#244d75}
input{display:block;width:100%;padding:12px 13px;border:1px solid #cbdcec;border-radius:10px;background:#fbfdff;font:inherit;font-size:14px;color:#173b61;outline:none;transition:border-color .18s,box-shadow .18s}
input:focus{border-color:var(--bpjs-blue2);box-shadow:0 0 0 3px #0879b81c;background:#fff}

.password-wrap{position:relative;display:flex;align-items:center}
.password-wrap input{padding-right:48px}
.password-toggle{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;justify-content:center;
  width:38px;height:38px;padding:0;margin:0;
  border:0;border-radius:8px;background:transparent;color:#6b8298;cursor:pointer;
}
.password-toggle:hover{background:#edf5fb;color:#0756a4}

.captcha-block{margin-top:15px}
.captcha-block>label{margin:0 0 7px}
.captcha-row{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.captcha-code{
  position:relative;display:flex;align-items:center;justify-content:center;flex:1;
  min-height:54px;border:1px solid #cfe0ef;border-radius:11px;overflow:hidden;
  background:repeating-linear-gradient(-18deg,#f0f7fc 0,#f0f7fc 8px,#e5f2f8 8px,#e5f2f8 16px);
  color:#0756a4;font-size:25px;font-weight:900;letter-spacing:8px;font-style:italic;
  text-shadow:2px 1px 0 #00a86b55,-1px -1px 0 #0756a433;user-select:none
}
.captcha-code:before,.captcha-code:after{content:"";position:absolute;left:-5%;width:110%;height:2px;background:#00a86b88;transform:rotate(-7deg);pointer-events:none}
.captcha-code:before{top:35%}.captcha-code:after{top:67%;background:#0756a466;transform:rotate(5deg)}
.captcha-refresh{width:48px;height:48px;flex:0 0 48px;padding:0;border:1px solid #d4e2ef;background:#fff;color:#0756a4;font-size:25px;border-radius:11px;cursor:pointer}
.captcha-refresh:hover{background:#f0f7fc}
.captcha-help{margin:6px 0 0;color:var(--muted);font-size:11px;line-height:1.4}

button.primary{
  border:0;border-radius:10px;padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;
  background:linear-gradient(105deg,var(--bpjs-blue),var(--bpjs-blue2));color:white;width:100%;margin-top:22px;
  transition:transform .15s,box-shadow .15s,filter .15s
}
button.primary:hover{transform:translateY(-1px);box-shadow:0 5px 12px #0756a420;filter:brightness(1.02)}
.text-link{display:block;margin:12px auto 0;border:0;background:transparent;color:#0b67ad;font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>

<section id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="login-mark">BPJS KESEHATAN</div>
    <h2>Masuk ke Generator Sertifikat</h2>
    <p class="login-subtitle">Silakan masuk untuk melanjutkan proses pembuatan sertifikat.</p>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" placeholder="Masukkan username" required>
      
      <label for="password">Password</label>
      <div class="password-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required>
        <button type="button" id="toggle-password" class="password-toggle" aria-label="Tampilkan password" title="Tampilkan password">
          <svg id="password-eye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <div class="captcha-block">
        <label for="captcha-input">Kode CAPTCHA</label>
        <div class="captcha-row">
          <div id="captcha-code" class="captcha-code" aria-label="Kode CAPTCHA"></div>
          <button type="button" id="refresh-captcha" class="captcha-refresh" title="Ganti kode CAPTCHA">↻</button>
        </div>
        <input id="captcha-input" name="captcha" autocomplete="off" placeholder="Ketik kode di atas" required>
        <p class="captcha-help">Masukkan kode yang terlihat. Klik ↻ jika kode sulit dibaca.</p>
      </div>

      <button class="primary" type="submit">Masuk</button>
      <button type="button" id="forgot-password" class="text-link">Lupa password?</button>
    </form>
  </div>
</section>

<script>
  let currentCaptcha = "";

  function generateCaptcha() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let code = "";
    for (let i = 0; i < 5; i++) {
      code += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    currentCaptcha = code;
    document.getElementById("captcha-code").textContent = code;
  }

  document.getElementById("refresh-captcha").addEventListener("click", generateCaptcha);

  document.getElementById("toggle-password").addEventListener("click", function() {
    const passwordInput = document.getElementById("password");
    if (passwordInput.type === "password") {
      passwordInput.type = "text";
    } else {
      passwordInput.type = "password";
    }
  });

  document.getElementById("login-form").addEventListener("submit", function(e) {
    e.preventDefault();
    const inputCaptcha = document.getElementById("captcha-input").value.trim().toUpperCase();
    
    if (inputCaptcha !== currentCaptcha) {
      alert("Kode CAPTCHA salah! Silakan coba lagi.");
      generateCaptcha();
      document.getElementById("captcha-input").value = "";
      return;
    }

    // Simpan status sesi ke localStorage
    localStorage.setItem("isLoggedIn", "true");
    
    // Alihkan pengguna ke halaman index.html
    window.location.href = "index.html";
  });

  document.getElementById("forgot-password").addEventListener("click", function() {
    alert("Silakan hubungi administrator BPJS Kesehatan untuk reset password.");
  });

  // Inisialisasi CAPTCHA saat halaman dimuat
  generateCaptcha();
</script>

</body>
</html>
