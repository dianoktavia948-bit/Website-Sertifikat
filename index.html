<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generator Sertifikat Satker BPJS Kesehatan</title>
<style>
:root{--bpjs-blue:#0756a4;--bpjs-blue2:#0b75bd;--bpjs-green:#00a86b;--ink:#173b61;--muted:#667d95;--line:#dce8f3;--bg:#f2f7fc}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#f5f9ff,#edf8f4);font-family:Inter,Arial,sans-serif;color:var(--ink)}
header{position:relative;overflow:hidden;background:linear-gradient(110deg,#064a91 0%,#0879b8 68%,#00a86b 100%);color:#fff;padding:25px max(20px,calc((100% - 1180px)/2));box-shadow:0 5px 18px #0756a422}
header .header-logo{position:relative;display:block;width:min(410px,90%);max-width:410px;height:auto;margin:0 0 10px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.12))}
header h1{position:relative;margin:0 0 7px;font-size:clamp(23px,3vw,31px);font-weight:800;letter-spacing:-.5px}
header p{position:relative;margin:0;opacity:.94;font-size:14px;line-height:1.5}
.header-top{display:flex;width:100%;align-items:center;justify-content:space-between}
.logout-btn{margin-left:auto;background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.5);padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.logout-btn:hover{background:rgba(255,255,255,0.3)}
main{max-width:900px;margin:26px auto 40px;padding:0 20px}
.panel{background:#fff;border:1px solid #dce8f3;border-radius:18px;padding:28px 32px 24px;box-shadow:0 12px 32px #124a7610}
h2{font-size:24px;margin:0 0 7px;color:#124d86;display:flex;align-items:center;gap:9px}h2:before{content:"";width:5px;height:26px;border-radius:5px;background:linear-gradient(var(--bpjs-blue),var(--bpjs-green));display:inline-block}
label{display:block;font-size:12px;font-weight:700;margin:0 0 7px;color:#345777}
input{display:block;width:100%;padding:12px 14px;border:1px solid #d4e2ef;border-radius:11px;background:#fbfdff;font:inherit;font-size:13px;color:#173b61;outline:none;transition:border-color .18s,box-shadow .18s}
input:focus{border-color:var(--bpjs-blue2);box-shadow:0 0 0 3px #0879b81c;background:#fff}
.form-eyebrow{display:flex;align-items:center;gap:8px;color:#07845a;font-size:10px;font-weight:800;letter-spacing:1.8px;margin-bottom:8px}
.eyebrow-dot{width:7px;height:7px;background:#00a86b;border-radius:50%}
.form-intro{max-width:650px;color:#71849a;font-size:13px;line-height:1.65;margin:0 0 18px}
.primary{background:linear-gradient(105deg,var(--bpjs-blue),var(--bpjs-blue2));color:white;border:0;border-radius:11px;padding:13px 18px;font-weight:700;font-size:14px;cursor:pointer;width:auto;margin-top:20px}
</style>
</head>
<body>

<!-- Pengecekan Keamanan Sesi Login di Awal Script -->
<script>
  if (localStorage.getItem('isLoggedIn') !== 'true') {
    window.location.href = 'login.html';
  }
</script>

<!-- Header Utama & Tombol Logout -->
<header id="app-header">
  <div class="header-top">
    <img class="header-logo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA0AAAADOCAYAAAAXMWJ3AAEAAElEQVR4nOy9d5wlR3Uv/j3V3TdMnp3Znc27WmlXu1rlLCQkQMKYjExOtnkYEx7giI2fn/Hzs41/NjYOZBswtsFki4xAgHKOm3MOs5Nnr7dXXV+f1Sn2zdP2pWfSch9tTfXtrvrWqapzTtWpU0WJ13x6EGcfEFwwzDCmEphTICoBbALk1o8XA0+DWH/g4QkyaAXvHPA3xdN+hgC3GM//5/OOlwjgSIELjqfN4OOrFfshnl5QPKhPPo7hBYNA4AYE9VPx7GedjuGp17zh95X4Gqfrd4865GnYfFVxg/xrxxpfa3Gb+Graphl94IZ0Aq5TBlMwByhGI1Tp2zK5NlToWK4aGvP/YdTszgY3cZg9b8VxR5KTJvCCgaAQYPoiqaoeLSoGLK1pX6A3mPYn3d368b6P7oM6XoZ3wA2b5J9dK26L16L1yK17L4rE6LYoK1sL0qE5L2z5LCoL9gD30XvT0r+uWz291f/2L2Pz+Ouf8XF9+6v/8D+376j83790z+80/f3v3/@x99178z46P/6287/84vf/f9/@48vf/0///cPPv2H//zXP/1nf799988v19/f3/rP3/f7T3/49/7z/7/9f/nO758f/wf3Xf3x6+/3//7r7/7Tf/zP7/7j5+/9/7n673//f//v//v3//334Pz/f/7D+/P/8//2+P1///f337n71/+87d+L3Pz3/9f4//1P9/v/+f/fXv//r9++Tj//H98f48D4n5eQAAAABJRU5ErkJggg==" alt="Logo BPJS Kesehatan">
    <button type="button" id="logout-button" class="logout-btn">Keluar / Logout</button>
  </div>
  <h1>Generator Sertifikat Satker BPJS Kesehatan</h1>
  <p>Sistem pembuatan sertifikat resmi untuk Satuan Kerja BPJS Kesehatan.</p>
</header>

<!-- Form Utama -->
<main id="certificate-screen">
  <div class="panel form-panel">
    <div class="form-eyebrow"><span class="eyebrow-dot"></span> FORMULIR SERTIFIKAT</div>
    <h2>Buat Sertifikat Baru</h2>
    <p class="form-intro">Lengkapi data di bawah ini untuk menghasilkan sertifikat.</p>
    <form id="certificate-form">
      <div>
        <label for="nama">Nama Lengkap & Gelar</label>
        <input type="text" id="nama" placeholder="Masukkan nama lengkap" required>
      </div>
      <button type="submit" class="primary">Proses Sertifikat</button>
    </form>
  </div>
</main>

<script>
  // Tombol Logout
  const logoutButton = document.getElementById('logout-button');
  if (logoutButton) {
    logoutButton.addEventListener('click', () => {
      localStorage.removeItem('isLoggedIn');
      window.location.href = 'login.html';
    });
  }
</script>

</body>
</html>
