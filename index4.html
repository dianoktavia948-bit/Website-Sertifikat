<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generator Sertifikat Satker BPJS Kesehatan</title>
<style>
:root{--bpjs-blue:#0756a4;--bpjs-blue2:#0b75bd;--bpjs-green:#00a86b;--ink:#173b61;--muted:#667d95;--line:#dce8f3;--bg:#f2f7fc}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f5f9ff,#edf8f4);font-family:Inter,Arial,sans-serif;color:var(--ink)}
header{position:relative;overflow:hidden;background:linear-gradient(110deg,#064a91 0%,#0879b8 68%,#00a86b 100%);color:#fff;padding:25px max(20px,calc((100% - 1180px)/2));box-shadow:0 5px 18px #0756a422}
header:after{content:"";position:absolute;width:230px;height:230px;border:32px solid #ffffff18;border-radius:50%;right:7%;top:-145px;pointer-events:none}
header{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left}header .header-logo{position:relative;display:block;width:min(410px,90%);max-width:410px;height:auto;margin:0 0 10px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.12))}header h1{position:relative;margin:0 0 7px;font-size:clamp(23px,3vw,31px);font-weight:800;letter-spacing:-.5px}header p{position:relative;margin:0;opacity:.94;font-size:14px;line-height:1.5}
main{max-width:1180px;margin:28px auto;padding:0 18px;display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:22px;align-items:start}
.panel,.preview{background:#fff;border:1px solid #dce8f3;border-radius:18px;padding:22px;box-shadow:0 12px 32px #124a7610}
h2{font-size:19px;margin:0 0 18px;color:var(--bpjs-blue);display:flex;align-items:center;gap:9px}h2:before{content:"";width:5px;height:22px;border-radius:5px;background:linear-gradient(var(--bpjs-blue),var(--bpjs-green));display:inline-block}
label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px;color:#244d75}
input{display:block;width:100%;padding:12px 13px;border:1px solid #cbdcec;border-radius:10px;background:#fbfdff;font:inherit;font-size:14px;color:#173b61;outline:none;transition:border-color .18s,box-shadow .18s}
input:focus{border-color:var(--bpjs-blue2);box-shadow:0 0 0 3px #0879b81c;background:#fff}input[type=date]{min-height:43px}
small{display:block;color:var(--muted);font-size:12px;line-height:1.6;margin-top:12px}
button{border:0;border-radius:10px;padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .15s,box-shadow .15s,filter .15s}
button:hover{transform:translateY(-1px);box-shadow:0 5px 12px #0756a420;filter:brightness(1.02)}button:active{transform:translateY(0)}
.primary{background:linear-gradient(105deg,var(--bpjs-blue),var(--bpjs-blue2));color:white;width:100%;margin-top:20px}.secondary{background:#eaf7f1;color:#087c55;border:1px solid #c7ebdc;flex:1}.secondary:last-child{background:linear-gradient(105deg,#0756a4,#0b75bd);color:#fff;border-color:transparent}
.actions{display:flex;gap:10px;margin-top:12px}.preview{min-width:0}.preview canvas{display:block;width:100%!important;height:auto!important;aspect-ratio:1404 / 993;object-fit:contain;border:1px solid #e1eaf2;border-radius:10px;background:white;box-shadow:0 4px 14px #153d5c0b}
.status{font-size:13px;margin-top:12px;color:#07834f;min-height:18px;padding:0 2px}
@media(max-width:800px){main{grid-template-columns:1fr;margin:18px auto}.panel,.preview{padding:18px}header{padding:22px 18px}}
@media(max-width:430px){.actions{flex-direction:column}.actions button{width:100%}}

.login-wrap{min-height:calc(100vh - 180px);display:flex;align-items:center;justify-content:center;padding:28px 18px}
.login-card{width:min(100%,440px);background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 18px 50px #124a7618}
.login-mark{font-size:12px;font-weight:800;letter-spacing:1.8px;color:var(--bpjs-green);margin-bottom:12px}
.login-card h2{margin-bottom:8px}.login-subtitle{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.login-card .primary{margin-top:22px}.login-note{font-size:11px;color:var(--muted);line-height:1.5;margin:14px 0 0}
#certificate-screen{display:block}
#certificate-screen .panel{grid-column:1/-1}
#certificate-screen .preview{grid-column:1/-1}
#certificate-screen .actions{margin-top:16px}

/* Pratinjau sertifikat dipusatkan dan diskalakan agar muat dalam satu layar laptop. */
body.preview-mode{height:100vh;overflow:hidden}
body.preview-mode header{padding-top:10px;padding-bottom:10px}
body.preview-mode header .header-logo{width:min(260px,65%);margin-bottom:4px}
body.preview-mode header h1{font-size:clamp(17px,2vw,23px);margin-bottom:3px}
body.preview-mode header p{font-size:12px}
body.preview-mode main#certificate-screen{height:calc(100vh - 105px);max-height:calc(100vh - 105px);margin:10px auto;padding:0 16px;display:flex;align-items:stretch;justify-content:center;overflow:hidden}
body.preview-mode #preview-panel{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;width:min(100%,1050px);height:100%;min-height:0;padding:12px 18px;overflow:hidden}
body.preview-mode #preview-panel h2{font-size:16px;margin-bottom:8px;flex:0 0 auto}
body.preview-mode #preview-panel canvas{width:auto!important;height:auto!important;max-width:100%;max-height:calc(100% - 155px);aspect-ratio:1404 / 993;object-fit:contain;flex:1 1 auto;min-height:0}
body.preview-mode #preview-panel .actions{flex:0 0 auto;margin-top:10px;width:min(100%,520px);justify-content:center}body.preview-mode #preview-panel .actions button{min-height:42px}
body.preview-mode #preview-panel .status{flex:0 0 auto;margin-top:5px}
body.preview-mode #preview-panel small{flex:0 0 auto;margin-top:4px;font-size:11px}
@media(max-height:650px){
 body.preview-mode header{padding-top:6px;padding-bottom:6px}
 body.preview-mode header .header-logo{width:min(200px,55%);margin-bottom:2px}
 body.preview-mode header p{display:none}
 body.preview-mode main#certificate-screen{height:calc(100vh - 68px);max-height:calc(100vh - 68px);margin:6px auto}
 body.preview-mode #preview-panel{padding:8px 12px}
 body.preview-mode #preview-panel canvas{max-height:calc(100% - 82px)}
}

/* Polesan akhir: pratinjau dan tombol selalu terlihat dalam satu layar laptop. */
body.preview-mode{
  height:100vh;
  min-height:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
body.preview-mode header{
  flex:0 0 auto;
  padding:8px max(20px,calc((100% - 1180px)/2));
}
body.preview-mode header .header-logo{
  width:min(220px,60%);
  margin:0 0 3px;
}
body.preview-mode header h1{
  font-size:clamp(17px,2vw,23px);
  margin:0 0 2px;
}
body.preview-mode header p{font-size:11px;line-height:1.25}
body.preview-mode main#certificate-screen{
  flex:1 1 auto;
  width:100%;
  min-height:0;
  height:auto;
  max-height:none;
  margin:8px auto 10px;
  padding:0 16px;
  display:flex;
  align-items:stretch;
  justify-content:center;
  overflow:hidden;
}
body.preview-mode #preview-panel{
  flex:1 1 auto;
  width:min(100%,1080px);
  height:100%;
  min-height:0;
  padding:12px 20px 10px;
  border-radius:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:0;
  overflow:hidden;
}
body.preview-mode #preview-panel h2{
  width:100%;
  flex:0 0 auto;
  font-size:16px;
  margin:0 0 8px;
}
body.preview-mode #preview-panel canvas{
  display:block;
  flex:0 1 auto;
  width:auto!important;
  height:auto!important;
  max-width:100%!important;
  max-height:calc(100vh - 275px)!important;
  min-height:0;
  object-fit:contain;
  aspect-ratio:1404 / 993;
  margin:0 auto;
  border:1px solid #e1eaf2;
  border-radius:10px;
  background:#fff;
  box-shadow:0 6px 20px #153d5c12;
}
body.preview-mode #preview-panel .actions{
  flex:0 0 auto;
  display:flex;
  width:min(100%,520px);
  gap:12px;
  margin:10px auto 0;
  justify-content:center;
}
body.preview-mode #preview-panel .actions button{
  flex:1 1 0;
  min-height:44px;
  border-radius:11px;
  font-size:14px;
}
body.preview-mode #preview-panel #back-to-form{
  background:#edf7f2;
  color:#087c55;
  border:1px solid #c7ebdc;
}
body.preview-mode #preview-panel #pdf{
  background:linear-gradient(105deg,#0756a4,#0b75bd);
  color:#fff;
  border:1px solid transparent;
}
body.preview-mode #preview-panel .status{
  flex:0 0 auto;
  min-height:0;
  margin:4px 0 0;
  font-size:12px;
}
body.preview-mode #preview-panel small{
  flex:0 0 auto;
  margin-top:3px;
  font-size:10px;
  line-height:1.35;
  text-align:center;
}
@media(max-height:720px){
  body.preview-mode header{padding-top:5px;padding-bottom:5px}
  body.preview-mode header .header-logo{width:min(180px,50%);margin-bottom:2px}
  body.preview-mode header p{display:none}
  body.preview-mode main#certificate-screen{margin:5px auto 7px}
  body.preview-mode #preview-panel{padding:8px 14px}
  body.preview-mode #preview-panel h2{margin-bottom:5px}
  body.preview-mode #preview-panel canvas{max-height:calc(100vh - 245px)!important}
  body.preview-mode #preview-panel .actions{margin-top:7px}
  body.preview-mode #preview-panel .actions button{min-height:38px}
  body.preview-mode #preview-panel small:last-child{display:none}
}
@media(max-width:600px){
  body.preview-mode #preview-panel .actions{flex-wrap:wrap}
  body.preview-mode #preview-panel .actions button{flex:1 1 42%;}
  body.preview-mode{overflow:auto;height:auto;min-height:100vh}
  body.preview-mode main#certificate-screen{overflow:visible;height:auto;max-height:none}
  body.preview-mode #preview-panel{height:auto;overflow:visible}
  body.preview-mode #preview-panel canvas{max-height:none!important;width:100%!important}
  body.preview-mode #preview-panel .actions{width:100%;gap:8px}
}


/* Form biodata: kartu terpusat dengan hierarki visual dan ruang yang lebih nyaman. */
body:not(.preview-mode) #certificate-screen{
  display:block;
  width:100%;
  max-width:900px;
  margin:26px auto 40px;
  padding:0 20px;
}
body:not(.preview-mode) #certificate-screen .form-panel{
  grid-column:auto;
  width:100%;
  padding:28px 32px 24px;
  border:1px solid #dce8f3;
  border-radius:20px;
  background:linear-gradient(145deg,#fff 0%,#fff 75%,#f7fcff 100%);
  box-shadow:0 18px 50px rgba(18,74,118,.09);
  position:relative;
  overflow:hidden;
}
body:not(.preview-mode) #certificate-screen .form-panel:after{
  content:"";
  position:absolute;
  right:-58px;
  top:-72px;
  width:180px;
  height:180px;
  border-radius:50%;
  border:22px solid rgba(7,86,164,.045);
  pointer-events:none;
}
.form-eyebrow{
  display:flex;
  align-items:center;
  gap:8px;
  color:#07845a;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.8px;
  margin-bottom:8px;
}
.eyebrow-dot{width:7px;height:7px;background:#00a86b;border-radius:50%;box-shadow:0 0 0 4px #00a86b18}
body:not(.preview-mode) .form-panel h2{
  position:relative;
  z-index:1;
  font-size:24px;
  letter-spacing:-.45px;
  margin:0 0 7px;
  color:#124d86;
}
body:not(.preview-mode) .form-panel h2:before{height:26px;width:5px}
.form-intro{
  position:relative;
  z-index:1;
  max-width:650px;
  color:#71849a;
  font-size:13px;
  line-height:1.65;
  margin:0 0 18px;
}
.step-track{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 16px;
  background:#f5f9fd;
  border:1px solid #e4edf6;
  border-radius:13px;
  margin:0 0 21px;
  position:relative;
  z-index:1;
}
.step-item{display:flex;align-items:center;gap:8px;white-space:nowrap;color:#8293a6}
.step-item>span{
  width:27px;height:27px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:50%;border:1px solid #d3dfeb;background:#fff;color:#7d90a5;
  font-size:12px;font-weight:800;
}
.step-item small{margin:0;font-size:12px;line-height:1.2;color:inherit;font-weight:600}
.step-item.is-done>span{background:#e4f7ee;border-color:#c3ead8;color:#07845a}
.step-item.is-current{color:#0756a4}
.step-item.is-current>span{background:linear-gradient(135deg,#0756a4,#0b75bd);border-color:transparent;color:white;box-shadow:0 4px 10px #0756a42b}
.step-line{height:1px;flex:1;background:#dce6f0;min-width:15px}
.step-line.is-done{background:linear-gradient(90deg,#00a86b,#8bd9b8)}
.field-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  column-gap:20px;
  row-gap:2px;
  position:relative;
  z-index:1;
}
.field-group{min-width:0}
.field-group.field-wide{grid-column:1/-1}
body:not(.preview-mode) .field-group label{
  margin:0 0 7px;
  font-size:12px;
  color:#345777;
  letter-spacing:.1px;
}
body:not(.preview-mode) .field-group input{
  min-height:45px;
  padding:12px 14px;
  border-color:#d4e2ef;
  background:#fbfdff;
  border-radius:11px;
  font-size:13px;
  box-shadow:inset 0 1px 2px rgba(20,60,100,.025);
}
body:not(.preview-mode) .field-group input:hover{border-color:#a9c8e3}
body:not(.preview-mode) .field-group input:focus{
  border-color:#0b75bd;
  box-shadow:0 0 0 3px rgba(11,117,189,.12);
}
.form-footer{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:16px;
  margin-top:22px;
  padding-top:17px;
  border-top:1px solid #edf2f7;
  position:relative;
  z-index:1;
}
.form-hint{color:#7a8da1;font-size:11px;line-height:1.5;max-width:330px}
.form-hint span{color:#0b75bd;font-size:14px;margin-right:5px}
body:not(.preview-mode) .form-footer .primary{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  width:auto;
  min-width:245px;
  margin:0;
  padding:13px 18px;
  border-radius:11px;
  box-shadow:0 7px 16px rgba(7,86,164,.18);
}
.button-arrow{font-size:18px;line-height:1;font-weight:500}
@media(max-width:700px){
 body:not(.preview-mode) #certificate-screen{margin:18px auto 28px;padding:0 13px}
 body:not(.preview-mode) #certificate-screen .form-panel{padding:22px 18px 18px;border-radius:16px}
 body:not(.preview-mode) .form-panel h2{font-size:21px}
 .field-grid{grid-template-columns:1fr}
 .field-group.field-wide{grid-column:auto}
 .form-footer{align-items:stretch;flex-direction:column}
 body:not(.preview-mode) .form-footer .primary{width:100%;min-width:0}
 .form-hint{max-width:none}
 .step-track{gap:6px;padding:11px 10px}
 .step-item{gap:5px}
 .step-item small{font-size:10px}
}


.captcha-block{margin-top:15px}
.captcha-block>label{margin:0 0 7px}
.captcha-row{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.captcha-code{
  position:relative;display:flex;align-items:center;justify-content:center;flex:1;
  min-height:54px;border:1px solid #cfe0ef;border-radius:11px;overflow:hidden;
  background:repeating-linear-gradient(-18deg,#f0f7fc 0,#f0f7fc 8px,#e5f2f8 8px,#e5f2f8 16px);
  color:#0756a4;font-size:25px;font-weight:900;letter-spacing:8px;font-style:italic;
  text-shadow:2px 1px 0 #00a86b55,-1px -1px 0 #0756a433;user-select:none
}
.captcha-code:before,.captcha-code:after{content:"";position:absolute;left:-5%;width:110%;height:2px;background:#00a86b88;transform:rotate(-7deg);pointer-events:none}
.captcha-code:before{top:35%}.captcha-code:after{top:67%;background:#0756a466;transform:rotate(5deg)}
.captcha-refresh{width:48px;height:48px;flex:0 0 48px;padding:0;border:1px solid #d4e2ef;background:#fff;color:#0756a4;font-size:25px;border-radius:11px}
.captcha-refresh:hover{background:#f0f7fc}
.captcha-help{margin:6px 0 0;color:#7a8da1;font-size:11px;line-height:1.4}
#login-form #captcha-input{margin-top:0}


.password-wrap{position:relative;display:flex;align-items:center}
.password-wrap input{padding-right:48px}
.password-toggle{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;justify-content:center;
  width:38px;height:38px;padding:0;margin:0;
  border:0;border-radius:8px;background:transparent;color:#6b8298;
  box-shadow:none;transition:background .15s,color .15s;
}
.password-toggle:hover{transform:translateY(-50%);box-shadow:none;filter:none;background:#edf5fb;color:#0756a4}
.password-toggle:focus-visible{outline:2px solid #0b75bd;outline-offset:1px}


/* Daftar puskesmas dan nomor surat otomatis */
body:not(.preview-mode) main#certificate-screen{
  max-width:1220px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 310px;
  align-items:start;
  gap:18px;
  margin:24px auto 36px;
  padding:0 18px;
}
body:not(.preview-mode) #certificate-screen .form-panel{
  grid-column:1;
  width:100%;
  min-width:0;
}
body:not(.preview-mode) #satker-panel{
  grid-column:2;
  display:flex;
  flex-direction:column;
  min-width:0;
  max-height:calc(100vh - 45px);
  padding:20px 16px 14px;
  background:#fff;
  border:1px solid #dce8f3;
  border-radius:18px;
  box-shadow:0 12px 32px #124a7610;
  overflow:hidden;
}
.satker-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
.satker-eyebrow{display:block;font-size:9px;letter-spacing:1.25px;font-weight:800;color:#07845a;margin-bottom:6px}
.satker-panel-head h2{font-size:17px;margin:0 0 5px}
.satker-panel-head h2:before{height:18px}
.satker-panel-head p{font-size:11px;line-height:1.45;color:#71849a;margin:0}
.satker-count{flex:0 0 34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:11px;background:#eaf7f1;color:#087c55;font-size:13px;font-weight:800}
.satker-search-label{font-size:11px!important;margin:0 0 6px!important}
#satker-search{min-height:39px;padding:10px 11px;border-radius:10px;font-size:12px;margin-bottom:11px}
.satker-list{display:flex;flex-direction:column;gap:5px;overflow-y:auto;min-height:100px;padding:1px 4px 1px 0;scrollbar-width:thin;scrollbar-color:#c9d9e8 transparent}
.satker-option{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;text-align:left;border:1px solid transparent;border-radius:9px;background:#f7fafd;color:#244d75;font-size:11px;line-height:1.3;font-weight:650;box-shadow:none}
.satker-option:hover{background:#eef7fc;border-color:#d9eaf6;box-shadow:none;transform:none;filter:none}
.satker-option.selected{background:#e8f6ef;border-color:#bfe7d3;color:#087c55}
.satker-option .satker-number{display:none;flex:0 0 auto;margin:0;padding:3px 5px;border-radius:5px;background:#fff;color:#087c55;font-size:9px;font-weight:800;line-height:1.2}
.satker-option.has-number .satker-number{display:block}
.satker-empty{font-size:12px;color:#71849a;text-align:center;padding:20px 8px}
.satker-panel-foot{display:flex;align-items:center;gap:7px;padding-top:11px;margin-top:10px;border-top:1px solid #edf2f7;color:#7a8da1;font-size:10px;line-height:1.4}
.mini-dot{width:7px;height:7px;border-radius:50%;background:#00a86b;flex:0 0 auto}
body:not(.preview-mode) #certificate-screen #preview-panel{grid-column:1/-1}
body.preview-mode #satker-panel{display:none!important}
body.preview-mode main#certificate-screen{display:flex!important}
body:not(.preview-mode) .field-group input[readonly]{background:#f1f6fb;color:#365b7b;cursor:default}
@media(max-width:900px){
 body:not(.preview-mode) main#certificate-screen{grid-template-columns:minmax(0,1fr) 270px;gap:12px;padding:0 12px}
 body:not(.preview-mode) #certificate-screen .form-panel{padding:22px 20px}
 body:not(.preview-mode) #satker-panel{padding:16px 12px}
}
@media(max-width:700px){
 body:not(.preview-mode) main#certificate-screen{display:flex;flex-direction:column;margin:18px auto;padding:0 13px}
 body:not(.preview-mode) #certificate-screen .form-panel{order:1}
 body:not(.preview-mode) #satker-panel{order:2;width:100%;max-height:420px}
 .satker-list{max-height:290px}
}


body:not(.preview-mode) .field-group select#satker{
  display:block;width:100%;min-height:45px;padding:12px 42px 12px 14px;
  border:1px solid #d4e2ef;border-radius:11px;background-color:#fbfdff;
